<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <linearGradient id="hand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>

  <!-- Hand / sign language icon (open hand, fingers up) -->
  <!-- Palm base -->
  <rect x="11" y="18" width="10" height="8" rx="2" fill="url(#hand)"/>

  <!-- Thumb -->
  <rect x="8" y="17" width="4" height="3" rx="1.5" fill="url(#hand)"/>

  <!-- Index finger -->
  <rect x="11" y="9" width="3" height="11" rx="1.5" fill="url(#hand)"/>

  <!-- Middle finger (tallest) -->
  <rect x="14.5" y="7" width="3" height="13" rx="1.5" fill="url(#hand)"/>

  <!-- Ring finger -->
  <rect x="18" y="9" width="3" height="11" rx="1.5" fill="url(#hand)"/>

  <!-- Little finger (shorter) -->
  <rect x="21.2" y="11.5" width="2.5" height="9" rx="1.25" fill="url(#hand)"/>
</svg>
